name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del frontend
        run: |
          cd frontend
          npm install

      - name: Compilar Frontend (dist)
        run: |
          cd frontend
          npm run build

      - name: Sincronizar Capacitor con Android
        run: |
          cd frontend
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar permisos de ejecucion para Gradle
        run: chmod +x frontend/android/gradlew

      - name: Compilar Debug APK con Gradle
        run: |
          cd frontend/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir log de error de Gradle en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-error-log
          path: frontend/android/gradle.log

      - name: Localizar archivo APK generado
        run: |
          find frontend/android -name "*.apk"

      - name: Subir artefacto APK (Artifacts de GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: control-asistencia-debug
          path: frontend/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release con el APK para descarga directa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-mobile
          name: 'Control de Asistencia Móvil v1.0.0 (APK)'
          body: |
            ### 📱 App Móvil para Android — Sistema de Asistencia y Turnos
            
            Esta aplicación móvil está compilada y conectada directamente al sistema en vivo:
            **https://popydev.com/auto-movil**
            
            #### Características de la App:
            - **Conectividad en vivo:** Carga la aplicación en tiempo real con sesión persistente.
            - **Permisos nativos:** Soporte completo de geolocalización GPS para marcación de asistencias.
            - **Compatibilidad:** Android 8.0 o superior (minSDK 26).
            
            #### Cómo instalar en tu teléfono Android:
            1. Descarga el archivo adjunto `app-debug.apk` directamente desde tu celular.
            2. Pulsa sobre el archivo descargado para instalarlo.
            3. Si tu celular te pide confirmación, activa *"Permitir instalar aplicaciones de fuentes desconocidas"*.
            4. Abre la aplicación **"Control Asistencia"** e inicia sesión con tus credenciales.
          files: frontend/android/**/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
