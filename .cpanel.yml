---
deployment:
  tasks:
    - export BACKENDPATH=/storage/popydev/backend
    - export DEPLOYPATH=/storage/popydev/public_html/auto-movil
    - /bin/mkdir -p $BACKENDPATH
    - /bin/cp -R backend/* $BACKENDPATH/
    - /bin/mkdir -p $BACKENDPATH/storage $BACKENDPATH/bootstrap/cache
    - /bin/chmod -R 775 $BACKENDPATH/storage $BACKENDPATH/bootstrap/cache
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R frontend/dist/* $DEPLOYPATH/
    - /bin/cp deployment/cpanel/public_html/index.php $DEPLOYPATH/index.php
    - /bin/cp deployment/cpanel/public_html/.htaccess $DEPLOYPATH/.htaccess
    - /opt/cpanel/ea-php82/root/usr/bin/php $BACKENDPATH/artisan migrate --force
    - /opt/cpanel/ea-php82/root/usr/bin/php $BACKENDPATH/artisan route:clear
    - /opt/cpanel/ea-php82/root/usr/bin/php $BACKENDPATH/artisan config:clear
    - /opt/cpanel/ea-php82/root/usr/bin/php $BACKENDPATH/artisan cache:clear
